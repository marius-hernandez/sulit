server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sulit
  config:
    # Loads KEY=VALUE pairs from a local .env file (if present) as properties.
    import: optional:file:.env[.properties]
  datasource:
    # Neon example: jdbc:postgresql://<host>.neon.tech/<db>?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PWD}
    hikari:
      # Neon free tier has low connection limits; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  chat:
    history-limit: ${CHAT_HISTORY_LIMIT:20}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: 5s
    read-timeout: 90s

management:
  endpoints:
    web:
      exposure:
        include: health

